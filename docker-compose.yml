# Pinned, not derived from the directory basename: `container_name` below is a global Docker name that
# Compose never namespaces, so from a git worktree (basename `wykonczymy-<slice>`) Compose would look
# for the container under a different project, fail to find it, try to create it, and collide on the
# name — which is what broke `scripts/test-integration.sh` in the pre-push hook. Pinning it also keeps
# every worktree on the SAME volumes instead of silently provisioning empty ones.
name: wykonczymy

services:
  db:
    image: postgres:17-alpine
    container_name: wykonczymy
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
  db-test:
    image: postgres:17-alpine
    container_name: wykonczymy-test
    ports:
      - '5435:5432'
    environment:
      POSTGRES_DB: wykonczymy-test
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata-test:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d wykonczymy-test']
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  pgdata:
  pgdata-test:
